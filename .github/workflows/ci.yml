name: CI

on:
  push:
    # Every branch, not just main. This repo's workflow is local branch ->
    # local merge -> push main, so a `branches: [main]` filter meant CI only
    # ever saw code that had already landed on the default branch. Tags are
    # excluded: release.yml owns `v*`. Push the branch first, so CI has run on
    # the commit before you tag it.
    branches: ["**"]
  pull_request:
    # Kept alongside the unfiltered push trigger for fork PRs — a push to a
    # fork does not trigger this repository's workflows.
    branches: [main]
  workflow_dispatch:

# Supersede in-flight runs for the same feature-branch ref. Main pushes get a
# per-run group so they never supersede or queue behind each other, and every
# commit on the default branch keeps its own run.
#
# `cancel-in-progress: false` alone is NOT enough to protect main: GitHub
# cancels an already-*pending* run in a group unconditionally when a new one
# queues, so a shared main group would let a third push discard the second
# push's queued run — and a slow run would head-of-line-block every later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # macos-14 provides Apple Silicon runners; MLX requires arm64 macOS.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Exact tag, not @v10: astral-sh/setup-uv stopped publishing moving
        # major tags after v7, so @v10 does not resolve.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # Pin uv itself. Every Python dependency is `==`-pinned and read via
          # `uv sync --frozen`, so letting the tool that reads the lock float
          # would leave one unpinned input that can break CI with no repo change.
          version: "0.12.4"
          enable-cache: true

      # The interpreter comes from .python-version (3.13); uv downloads it if
      # the runner image doesn't ship it, so the runner image can't silently
      # change which Python the suite runs against.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Run tests
        run: uv run pytest -v
        # All tests are mocked — none load the real model — so the suite runs
        # fast on CI. The model-loading smoke check is the manual probe:
        # `uv run python scripts/probe_mlx_vlm.py` (not run in CI).
